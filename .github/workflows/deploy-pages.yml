name: Deploy SoundScript Site

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # Lab branch dispatches must not replace the production website.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node for integrity verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test integrity verifier
        run: node --test scripts/playground-integrity.test.cjs scripts/playground-startup.test.cjs

      - name: Check public documentation state
        shell: pwsh
        run: ./scripts/update-docs.ps1 -Check

      - name: Generate homepage repository metrics
        shell: pwsh
        run: ./scripts/update-site-metrics.ps1

      - name: Build and verify a fresh site artifact
        shell: pwsh
        run: ./scripts/publish-site.ps1

      - name: Validate browser startup before deployment
        run: |
          npm ci --prefix scripts
          npx --prefix scripts playwright install --with-deps chromium
          node scripts/verify-playground-startup.cjs artifacts/site/playground

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/site
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false

      - name: Remind Pages source setting
        if: success()
        run: |
          echo "::notice title=GitHub Pages source::In Settings → Pages, set Source to Deploy from a branch: gh-pages / (root). Custom domain: soundscript.net (CNAME in docs/)."
