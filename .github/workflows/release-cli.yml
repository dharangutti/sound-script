name: CLI release

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - rid: win-x64
          - rid: linux-x64
          - rid: osx-x64
          - rid: osx-arm64
    runs-on: ${{ startsWith(matrix.rid, 'win-') && 'windows-latest' || startsWith(matrix.rid, 'osx-') && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file executable
        run: dotnet publish src/SoundScript.Cli/SoundScript.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/${{ matrix.rid }}
      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $asset = "soundscript-${{ github.ref_name }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path artifacts/${{ matrix.rid }}/* -DestinationPath $asset
          (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant() + "  " + $asset | Set-Content -NoNewline "$asset.sha256"
          "asset=$asset" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: soundscript-${{ github.ref_name }}-${{ matrix.rid }}
          path: |
            ${{ steps.archive.outputs.asset }}
            ${{ steps.archive.outputs.asset }}.sha256
  tool-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack .NET tool
        run: dotnet pack src/SoundScript.Cli/SoundScript.Cli.csproj -c Release --output artifacts/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: soundscript-dotnet-tool
          path: artifacts/nuget/*.nupkg
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, tool-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*
