name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Multi-OS matrix: SoundScript.Wave's determinism suite claims
    # byte-identical WAV checksums "across machines/OS/CPU" — this is that
    # claim's regression check, not just an ubuntu-only smoke test. Reuses
    # the checkout/setup-dotnet steps deploy-pages.yml already established
    # rather than introducing a different CI mechanism.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Release, Debug]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # Build the reviewed embedded snapshot; syncing upstream is not validation.

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node for publish verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check documentation state and drift
        shell: pwsh
        run: ./scripts/update-docs.ps1 -Check

      - name: Test documentation validation and homepage history
        run: |
          node --test scripts/docs-state.test.mjs scripts/homepage-release.test.cjs scripts/release-promotion.test.mjs
          node scripts/verify-v15-acceptance.mjs

      # eSpeak powers the wordbank auto-generation integration tests. When it is
      # absent those tests soft-skip, so the Windows install is best-effort.
      - name: Install eSpeak (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install eSpeak (macOS)
        if: runner.os == 'macOS'
        run: brew install espeak-ng

      - name: Install eSpeak (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install espeak --yes --no-progress

      - name: Validate corpus provenance metadata
        run: node scripts/corpus-provenance.cjs

      - name: Restore complete solution
        run: dotnet restore SoundScript.sln

      - name: Build complete solution
        run: dotnet build SoundScript.sln -c ${{ matrix.configuration }} --no-restore

      - name: Check transcription browser input boundary
        run: node --test scripts/transcription-browser-input.test.cjs scripts/playground-integrity.test.cjs scripts/playground-startup.test.cjs scripts/corpus-provenance.test.cjs

      - name: Build visual verification tool
        run: dotnet build tools/VisualParity -c ${{ matrix.configuration }}

      - name: Publish Playground for local validation
        run: dotnet publish src/SoundScript.Playground -c Release --no-restore -p:PublishDir=${{ github.workspace }}/artifacts/playground/

      - name: Install browser verification dependencies
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix scripts
          npx --prefix scripts playwright install --with-deps chromium

      - name: Verify real browser startup and integrity failure handling
        if: runner.os == 'Linux'
        run: node scripts/verify-playground-startup.cjs artifacts/playground

      - name: Verify documentation code UX
        if: runner.os == 'Linux'
        run: node scripts/verify-docs-code.cjs

      - name: Run tests
        env:
          SOUNDSCRIPT_PLAYGROUND_PUBLISH_DIR: ${{ github.workspace }}/artifacts/playground
        run: dotnet test src/SoundScript.Tests -c ${{ matrix.configuration }} --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=tests.trx"

      - name: Produce Release dependency inventory
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/dependency-inventory.ps1

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            src/SoundScript.Tests/TestResults/*.trx
            artifacts/dependency-inventory/
