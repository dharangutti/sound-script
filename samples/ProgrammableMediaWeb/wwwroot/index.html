<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundScript programmable media</title>
<style>
  body { max-width: 960px; margin: 2rem auto; padding: 0 1rem; font: 18px system-ui; background: #f8fafc; color: #172033; }
  button, select { font: inherit; padding: .5rem; margin: .3rem; }
  audio, img { display: block; width: 100%; }
  img { aspect-ratio: 16 / 9; background: white; border: 1px solid #cbd5e1; border-radius: 12px; }
  #error { color: #b91c1c; }
</style>
<h1>One program. Audio and visual state.</h1>
<p>The audio player's position controls the scene. Pause, resume, or seek with the player below.</p>
<label>Equipment state <select id="scenario"><option>Healthy</option><option>Warning</option><option>Critical</option></select></label>
<button id="play">Play / Resume</button><button id="pause">Pause</button><button id="restart">Restart</button>
<audio id="audio" controls preload="auto"></audio>
<p><output id="position">0.00 s</output></p>
<img id="scene" alt="Animated equipment status">
<p id="error" role="alert"></p>
<hr>
<h2>Adaptive runtime values</h2>
<p>This separate monitor was compiled once. Change the typed values and apply a new complete render.</p>
<label>Intensity <input id="runtime-intensity" type="number" min="0" max="1" step="0.01" value="0.25"></label>
<label>Indicator x <input id="runtime-xpos" type="number" min="-12800" max="12800" step="1" value="200"></label>
<button id="runtime-apply">Apply runtime values</button>
<output id="runtime-status" role="status">Loading runtime parameter schema…</output>
<audio id="runtime-audio" controls preload="none"></audio>
<img id="runtime-scene" alt="Indicator scene rendered from a runtime snapshot">
<p id="runtime-error" role="alert"></p>
<script src="app.js"></script>
</html>
